"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

spotlight_testing = false

[scripts]
setup = "bash scripts/setup-conductor.sh"
archive = "bash scripts/dev-conductor.sh archive"
run_mode = "concurrent"

[scripts.run.dev]
command = "COMPANION_COMPANIONS_ENABLED=true COMPANION_COMPANIONS_ALLOWED_EMAIL_DOMAINS=thevibecompany.co bash scripts/dev-conductor.sh"
default = true
icon = "play"

[scripts.run.check]
command = "pnpm verify:change"
icon = "test-tube"

[scripts.run.mobile-ios]
available_in = ["local"]
command = "pnpm mobile:ios"
icon = "smartphone"

[scripts.run.mobile-android]
available_in = ["local"]
command = "pnpm mobile:android"
icon = "smartphone"

[scripts.run.mobile-metro]
available_in = ["local"]
command = "pnpm mobile:metro"
icon = "smartphone"
