# Native changes produce a new TestFlight build. JavaScript-only changes are
# delivered as compatible EAS Updates to the existing production build.
name: TestFlight

on:
  push:
    branches: [main]

jobs:
  fingerprint:
    name: Native fingerprint
    type: fingerprint
    environment: production
    env:
      APP_VARIANT: production

  get_ios_build:
    name: Existing iOS build for this fingerprint
    needs: [fingerprint]
    type: get-build
    params:
      platform: ios
      profile: production
      distribution: store
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      wait_for_in_progress: true

  build_ios:
    name: Build iOS
    needs: [get_ios_build]
    if: ${{ !needs.get_ios_build.outputs.build_id }}
    type: build
    params:
      platform: ios
      profile: production

  testflight:
    name: Submit to TestFlight
    needs: [build_ios]
    type: testflight
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production
      changelog: ${{ github.commit_message || 'New build' }}

  publish_ios_update:
    name: Publish compatible iOS update
    needs: [get_ios_build]
    if: ${{ needs.get_ios_build.outputs.build_id }}
    type: update
    environment: production
    env:
      APP_VARIANT: production
    params:
      platform: ios
      channel: production
      message: ${{ github.commit_message || 'Mobile update' }}
