name: Companion Runtime Real-Provider Canary

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: companion-runtime-real-provider-canary
  cancel-in-progress: false

jobs:
  canary:
    name: Disposable Box/Pi canary
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Run real-provider lifecycle canary
        run: pnpm canary:companions-runtime
        env:
          COMPANION_CANARY_API_URL: ${{ secrets.COMPANION_CANARY_API_URL }}
          COMPANION_CANARY_EMAIL: ${{ secrets.COMPANION_CANARY_EMAIL }}
          COMPANION_CANARY_PASSWORD: ${{ secrets.COMPANION_CANARY_PASSWORD }}
          COMPANION_CANARY_ORG_ID: ${{ secrets.COMPANION_CANARY_ORG_ID }}
          COMPANION_CANARY_PROVIDER_ID: ${{ secrets.COMPANION_CANARY_PROVIDER_ID }}
          COMPANION_CANARY_MODEL_ID: ${{ secrets.COMPANION_CANARY_MODEL_ID }}
          COMPANION_CANARY_IMAGE_URL: ${{ secrets.COMPANION_CANARY_IMAGE_URL }}
          COMPANION_CANARY_IMAGE_EXPECTED_TEXT: ${{ secrets.COMPANION_CANARY_IMAGE_EXPECTED_TEXT }}
          COMPANION_CANARY_RELEASE_ID: ${{ secrets.COMPANION_CANARY_RELEASE_ID }}
