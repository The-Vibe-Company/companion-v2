name: Box Provider E2E

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - ".github/workflows/box-provider-e2e.yml"
      - "apps/runtime/**"
      - "packages/box-runtime/**"
      - "packages/box-sim/**"
      - "packages/companion-runtime/**"
      - "pnpm-lock.yaml"
      - "scripts/box-runtime-change-e2e.ts"
      - "scripts/summarize-box-runtime-benchmark.mjs"
  schedule:
    - cron: "47 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: box-provider-e2e
  cancel-in-progress: false

jobs:
  box-provider-e2e:
    name: Disposable Box archive/resume
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Run Box provider end-to-end test
        run: node scripts/box-provider-e2e.mjs
        env:
          COMPANION_BOX_API_KEY: ${{ secrets.COMPANION_BOX_E2E_API_KEY }}
          COMPANION_BOX_E2E_IMAGE: ${{ vars.COMPANION_BOX_E2E_IMAGE }}

  runtime-change-e2e:
    name: Current change first-message delivery
    # Both jobs share one provider account. Serialize them on main while still letting this job run
    # after the archive/resume job is skipped on pull requests.
    needs: box-provider-e2e
    if: >-
      !cancelled()
      && (github.event_name == 'push'
        || github.event_name == 'schedule'
        || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        || (github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && github.event.pull_request.user.login == vars.COMPANION_BOX_E2E_TRUSTED_LOGIN
          && github.actor == vars.COMPANION_BOX_E2E_TRUSTED_LOGIN
          && github.triggering_actor == vars.COMPANION_BOX_E2E_TRUSTED_LOGIN))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test the current runtime change on a disposable Box
        id: runtime_e2e
        run: |
          set -o pipefail
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            : > "$RUNNER_TEMP/box-runtime-change-e2e.log"
            for ((cycle = 1; cycle <= 10; cycle++)); do
              pnpm e2e:box-runtime-change 2>&1 \
                | tee -a "$RUNNER_TEMP/box-runtime-change-e2e.log"
            done
            node scripts/summarize-box-runtime-benchmark.mjs \
              "$RUNNER_TEMP/box-runtime-change-e2e.log"
          else
            pnpm e2e:box-runtime-change 2>&1 \
              | tee "$RUNNER_TEMP/box-runtime-change-e2e.log"
          fi
        env:
          COMPANION_BOX_API_KEY: ${{ secrets.COMPANION_BOX_E2E_API_KEY }}
          COMPANION_BOX_E2E_ZAI_API_KEY: ${{ secrets.COMPANION_BOX_E2E_ZAI_API_KEY }}
          COMPANION_BOX_E2E_IMAGE: ${{ vars.COMPANION_BOX_E2E_IMAGE }}
          COMPANION_BOX_E2E_GENERATION: ${{ vars.COMPANION_BOX_E2E_GENERATION }}
          COMPANION_BOX_E2E_MODEL_ID: ${{ vars.COMPANION_BOX_E2E_MODEL_ID }}

      - name: Update the PR performance report
        if: always() && github.event_name == 'pull_request'
        run: node scripts/update-pr-box-e2e-report.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMPANION_E2E_PR_NUMBER: ${{ github.event.pull_request.number }}
          COMPANION_E2E_TESTED_SHA: ${{ github.event.pull_request.head.sha }}
          COMPANION_E2E_STEP_OUTCOME: ${{ steps.runtime_e2e.outcome }}
          COMPANION_E2E_REPORT_PATH: ${{ runner.temp }}/box-runtime-change-e2e.log
          COMPANION_E2E_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
