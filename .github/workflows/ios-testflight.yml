name: "Release: iOS TestFlight"

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  actions: read
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  release-scope:
    name: Select a CI-approved iOS commit
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ios: ${{ steps.scope.outputs.ios }}
      release_sha: ${{ steps.scope.outputs.release_sha }}
    steps:
      - name: Download the CI-approved push range
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ios-testflight-scope
          path: ${{ runner.temp }}/ios-testflight-scope
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Checkout the CI-approved commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Detect native iOS changes
        id: scope
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          TESTFLIGHT_BEFORE_SHA_FILE: ${{ runner.temp }}/ios-testflight-scope/before-sha
          TESTFLIGHT_RELEASE_SHA_FILE: ${{ runner.temp }}/ios-testflight-scope/release-sha
        run: node scripts/ios-testflight-scope.mjs

  upload:
    name: Archive and upload native iOS
    needs: release-scope
    if: needs.release-scope.outputs.ios == 'true'
    runs-on: macos-26
    environment: ios-testflight
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.release-scope.outputs.release_sha }}

      - name: Verify Xcode 26 toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          if [[ "$sdk_version" != 26.* ]]; then
            echo "Expected the iPhoneOS 26 SDK, got $sdk_version" >&2
            exit 1
          fi

      - name: Install distribution signing assets
        env:
          IOS_DISTRIBUTION_P12: ${{ secrets.IOS_DISTRIBUTION_P12 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          keychain_path="$RUNNER_TEMP/companion-signing.keychain-db"
          certificate_path="$RUNNER_TEMP/companion-distribution.p12"
          profile_path="$HOME/Library/MobileDevice/Provisioning Profiles/e2dfd6f6-3e07-4168-bdf4-19adfc4c2c46.mobileprovision"
          keychain_password="$(openssl rand -hex 32)"

          printf '%s' "$IOS_DISTRIBUTION_P12" | base64 --decode > "$certificate_path"
          mkdir -p "$(dirname "$profile_path")"
          printf '%s' "$IOS_PROVISIONING_PROFILE" | base64 --decode > "$profile_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -P "$IOS_DISTRIBUTION_P12_PASSWORD" -t cert -f pkcs12 -k "$keychain_path" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

      - name: Archive and upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          IOS_PROVISIONING_PROFILE_SPECIFIER: Companion Native App Store 2026-08-24
          RELEASE_OUTPUT_DIR: ${{ runner.temp }}/companion-ios-release-${{ github.run_id }}-${{ github.run_attempt }}
        run: bash apps/ios/scripts/release.sh

      - name: Remove temporary signing assets
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/companion-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/companion-distribution.p12"
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/e2dfd6f6-3e07-4168-bdf4-19adfc4c2c46.mobileprovision"

      - name: Upload release diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-testflight-diagnostics
          path: ${{ runner.temp }}/companion-ios-release-*/**/*.log
          if-no-files-found: ignore
