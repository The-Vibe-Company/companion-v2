_metadata:
  major_version: 1
  minor_version: 1
display_information:
  name: Companion
  description: Send messages from a Companion teammate.
  background_color: "#4A154B"
features:
  bot_user:
    display_name: Companion
    always_online: false
oauth_config:
  redirect_urls:
    - https://companion.example/v1/companion-plugins/oauth/callback
  scopes:
    bot:
      - chat:write
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: true
